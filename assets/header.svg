<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Ambient Blur Filters -->
    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradient Defs -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Tech Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.12" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-left {
      0%, 100% { opacity: 0.45; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.8; transform: scale(1.18) translate(20px, -10px); }
    }
    @keyframes pulse-right {
      0%, 100% { opacity: 0.4; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.75; transform: scale(1.15) translate(-25px, 12px); }
    }
    @keyframes sweep-beam {
      0% { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }
    @keyframes beacon-blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.3; filter: none; }
    }
    .orb-left {
      transform-origin: 220px 110px;
      animation: pulse-left 6.5s ease-in-out infinite;
    }
    .orb-right {
      transform-origin: 680px 130px;
      animation: pulse-right 7.5s ease-in-out infinite;
    }
    .beam {
      animation: sweep-beam 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .beacon {
      animation: beacon-blink 2s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
      fill: url(#text-grad);
      filter: drop-shadow(0 2px 20px rgba(56, 189, 248, 0.4));
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, 'Fira Code', 'Roboto Mono', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bg-grad)" />

  <!-- Subtle Dot Grid Overlay -->
  <rect width="900" height="240" rx="14" fill="url(#dot-grid)" />

  <!-- Ambient Light Glow Orbs -->
  <g filter="url(#ambient-blur)">
    <!-- Cyan & Emerald Aura (Left) -->
    <circle class="orb-left" cx="220" cy="110" r="120" fill="#06b6d4" />
    <circle class="orb-left" cx="310" cy="160" r="85" fill="#10b981" opacity="0.65" />
    <!-- Indigo & Violet Aura (Right) -->
    <circle class="orb-right" cx="680" cy="120" r="130" fill="#6366f1" />
    <circle class="orb-right" cx="590" cy="80" r="95" fill="#a855f7" opacity="0.65" />
  </g>

  <!-- Glassmorphic Vignette -->
  <rect width="900" height="240" rx="14" fill="#000000" opacity="0.22" />

  <!-- Sleek 1px Gradient Glass Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="13.5" fill="none" stroke="url(#border-grad)" stroke-width="1.2" />

  <!-- Status Pill Badge -->
  <g transform="translate(450, 48)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0b1329" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle class="beacon" cx="-115" cy="0" r="4" fill="#10b981" />
    <text class="badge-text" x="-98" y="4">SYSTEMS • AI • EMBEDDED</text>
  </g>

  <!-- Main Heading: ayuuXploits -->
  <text class="title-text" x="450" y="125" text-anchor="middle">ayuuXploits</text>

  <!-- Description / Tagline -->
  <text class="desc-text" x="450" y="165" text-anchor="middle">Hacking silicon, exploring brains and bending pixels</text>

  <!-- Bottom Luminous Laser Accent Beam -->
  <g transform="translate(0, 238)">
    <rect width="900" height="2" fill="#0b1329" />
    <g class="beam">
      <rect x="-400" width="800" height="2" fill="url(#beam-grad)" filter="url(#glow)" />
    </g>
  </g>
</svg>
